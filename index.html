
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIVI — Suas memórias</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>VIVI</h1>
      <p>Suas memórias, para sempre.</p>
    </header>

    <section id="auth">
      <h2>Bem-vindo ao VIVI</h2>
      <div id="signup">
        <h3>Criar conta</h3>
        <input id="name" placeholder="Seu nome">
        <input id="email" type="email" placeholder="Seu e-mail">
        <input id="password" type="password" placeholder="Sua senha">
        <button id="signupBtn">Criar minha conta</button>
      </div>

      <div id="login">
        <h3>Já tenho uma conta</h3>
        <input id="loginEmail" type="email" placeholder="Seu e-mail">
        <input id="loginPassword" type="password" placeholder="Sua senha">
        <button id="loginBtn">Entrar</button>
      </div>
      <p id="message"></p>
    </section>

    <section id="profile" hidden>
      <h2>Seu espaço de memórias</h2>
      <p id="welcome"></p>
      <button id="logoutBtn">Sair da conta</button>

      <h3>Criar uma memória</h3>
      <input id="title" placeholder="Título da memória">
      <textarea id="description" placeholder="Conte sua lembrança"></textarea>
      <input id="memoryDate" type="date">
      <input id="memoryFile" type="file" accept="image/*,video/*">
      <button id="saveMemoryBtn">Guardar memória</button>

      <h3>Minhas lembranças</h3>
      <div id="memories"></div>
    </section>
  </main>
</body>
</html>
